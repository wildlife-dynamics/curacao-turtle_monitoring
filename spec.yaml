id: turtle_monitoring

requirements:
  - name: ecoscope-platform
    version: ">=2.17.0,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc24"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: ecoscope-workflows-ext-curacao
    version: "0.0.2.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

rjsf-overrides:
  properties:
    # ── Nesting Activity Over Time ───────────────────────────────────────────
    nesting_over_time_chart.properties.time_interval.title: Time Interval
    nesting_over_time_chart.properties.time_interval.description: Group and bucket nesting events by this time period on the chart.
    nesting_over_time_chart.properties.time_interval.oneOf:
      - const: year
        title: Year
      - const: month
        title: Month
      - const: week
        title: Week
      - const: day
        title: Day
      - const: hour
        title: Hour

    # ── Nesting Layer ────────────────────────────────────────────────────────
    Nesting.properties.nesting_layer.properties.use_icons.default: false
    Nesting.properties.nesting_layer.properties.tooltip_columns.ecoscope:advanced: true

    # ── Turtle Layer ─────────────────────────────────────────────────────────
    Turtle-Related Events.properties.turtle_layer.properties.tooltip_columns.ecoscope:advanced: true
    Turtle-Related Events.properties.turtle_layer.properties.radius_max_pixels.default: 20
    Turtle-Related Events.properties.turtle_layer.properties.radius_max_pixels.description: Maximum point radius in pixels. Caps how large points grow when zoomed in.
    Turtle-Related Events.properties.turtle_layer.properties.get_line_color.default: "#000000"
    Turtle-Related Events.properties.turtle_layer.properties.get_line_color.description: Outline color as a CSS hex string (e.g. '#000000' for black). Only visible when stroked is enabled.
    Turtle-Related Events.properties.turtle_layer.properties.line_width_max_pixels.default: 2
    Turtle-Related Events.properties.turtle_layer.properties.line_width_max_pixels.description: Maximum outline width in pixels. Caps how wide the stroke grows at high zoom.

    # ── Report Template ───────────────────────────────────────────────────────
    report_template_path.properties.var.title: Report Template Path
    report_template_path.properties.var.description: Path or URL to the .docx Jinja2 template used for the turtle monitoring report.
    report_template_path.properties.var.default: "https://raw.githubusercontent.com/wildlife-dynamics/curacao-turtle_monitoring/main/resources/templates/turtle_monitoring_template.docx"
    report_template_path.properties.var.ecoscope:advanced: true

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client
    task: set_er_connection

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y"

  - name: Report Template Path
    id: report_template_path
    task: set_string_var

  - name: Base Maps
    id: base_maps
    task: set_base_maps

  - name: Chart Colors
    id: chart_palette
    task: set_color_palette

  # FEEDBACK #1: toggle between EarthRanger SVG icons and scatterplot dots on the nesting map.
  # Default is false (scatterplot) — icons cluster badly when zoomed out with ~100 events.

  # ── Fetch & Process All Events ────────────────────────────────────────────

  - name: Fetch All Events
    id: all_events
    task: get_events
    partial:
      client: ${{ workflow.er_client.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - event_type
        - geometry
        - event_details
      event_types:
        - suspected_nest_v2
        - attempt_v2
        - dry_run_v2
        - hatching_data
        - relocation_data_v2
        - turtle_data_form_v2
      include_details: true
      include_display_values: true
      raise_on_empty: false
      include_updates: false
      include_related_events: false
      include_null_geometry: false
      force_point_geometry: true

  - name: Process Event Details
    id: all_events_processed
    task: process_events_details
    partial:
      df: ${{ workflow.all_events.return }}
      client: ${{ workflow.er_client.return }}
      map_to_titles: true
      ordered: false

  # ── Filter Event Types ────────────────────────────────────────────────────

  - name: Filter Nesting Events
    id: nesting_events_raw
    task: filter_row_values
    partial:
      df: ${{ workflow.all_events_processed.return }}
      column: event_type
      values:
        - suspected_nest_v2
        - attempt_v2
        - dry_run_v2

  # FEEDBACK #2: dry_run_v2 was missing from the map (it was in the table but not here).
  # relocation_data_v2 kept alongside dry_run_v2 so relocations still appear on the map.
  - name: Filter Map Nesting Events
    id: map_nesting_events_raw
    task: filter_row_values
    partial:
      df: ${{ workflow.all_events_processed.return }}
      column: event_type
      values:
        - suspected_nest_v2
        - attempt_v2
        - relocation_data_v2
        - dry_run_v2

  - name: Filter Suspected Nest Events
    id: suspected_nest_events
    task: filter_row_values
    partial:
      df: ${{ workflow.all_events_processed.return }}
      column: event_type
      values:
        - suspected_nest_v2

  - name: Filter Hatching Events
    id: hatching_events
    task: filter_row_values
    partial:
      df: ${{ workflow.all_events_processed.return }}
      column: event_type
      values:
        - hatching_data

  - name: Filter Turtle Events
    id: turtle_events
    task: filter_row_values
    partial:
      df: ${{ workflow.all_events_processed.return }}
      column: event_type
      values:
        - turtle_data_form_v2

  # ── Extract Fields ────────────────────────────────────────────────────────

  - name: Extract Nesting Fields
    id: nesting_data
    task: extract_nesting_fields
    partial:
      df: ${{ workflow.nesting_events_raw.return }}

  - name: Extract Map Nesting Fields
    id: map_nesting_data
    task: extract_nesting_fields
    partial:
      df: ${{ workflow.map_nesting_events_raw.return }}

  - name: Extract Suspected Nest Fields
    id: suspected_nest_data
    task: extract_nesting_fields
    partial:
      df: ${{ workflow.suspected_nest_events.return }}

  - name: Extract Hatching Fields
    id: hatching_data
    task: extract_hatching_fields
    partial:
      df: ${{ workflow.hatching_events.return }}

  - name: Extract Turtle Fields
    id: turtle_data
    task: extract_turtle_fields
    partial:
      df: ${{ workflow.turtle_events.return }}

  # ── Headline Stats ────────────────────────────────────────────────────────

  - title: Headline Stats
    type: task-group
    description: Key statistics for the turtle monitoring period.
    tasks:
      - name: Total Nesting Events Count
        id: total_nesting_count
        task: dataframe_count
        partial:
          df: ${{ workflow.nesting_events_raw.return }}

      - name: Total Nesting Events Widget
        id: total_nesting_widget
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Total Nesting Events"
          decimal_places: 0
          data: ${{ workflow.total_nesting_count.return }}

      - name: Total Hatched Eggs
        id: total_hatched_eggs
        task: dataframe_column_sum
        partial:
          df: ${{ workflow.hatching_data.return }}
          column_name: hatchedempty_egg_shells

      - name: Total Hatched Eggs Widget
        id: total_hatched_eggs_widget
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Total Hatched Eggs"
          decimal_places: 0
          data: ${{ workflow.total_hatched_eggs.return }}

      - name: Hatching Success Percentage
        id: hatching_success_pct
        task: compute_hatching_success_pct
        partial:
          df: ${{ workflow.hatching_data.return }}

      - name: Hatching Success Widget
        id: hatching_success_widget
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Hatching Success (%)"
          decimal_places: 1
          data: ${{ workflow.hatching_success_pct.return }}

      - name: Total Turtle-Related Events Count
        id: total_turtle_count
        task: dataframe_count
        partial:
          df: ${{ workflow.turtle_events.return }}

      - name: Total Turtle-Related Events Widget
        id: total_turtle_widget
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Total Turtle-Related Events"
          decimal_places: 0
          data: ${{ workflow.total_turtle_count.return }}

      - name: Filter Turtles with FP
        id: fp_events
        task: filter_df
        partial:
          df: ${{ workflow.turtle_data.return }}
          column_name: fibropapillomatosis
          op: equal
          value: "yes"
          reset_index: true

      - name: Total Turtles with FP Count
        id: total_fp_count
        task: dataframe_count
        partial:
          df: ${{ workflow.fp_events.return }}

      - name: Total Turtles with FP Widget
        id: total_fp_widget
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Total Turtles with FP"
          decimal_places: 0
          data: ${{ workflow.total_fp_count.return }}

  # ── Nesting ───────────────────────────────────────────────────────────────

  - title: Nesting
    type: task-group
    description: ""
    tasks:
      - id: nesting_colormap
        task: apply_qualitative_color_map
        partial:
          df: ${{ workflow.map_nesting_data.return }}
          input_column_name: event_type_display

      - id: nesting_layer
        task: create_nesting_layer
        partial:
          df: ${{ workflow.nesting_colormap.return }}
          client: ${{ workflow.er_client.return }}

      - id: nesting_map_view_state
        task: compute_fitted_view_state
        partial:
          geo_layers: ${{ workflow.nesting_layer.return }}
          max_zoom: 15

      - name: Nesting Activity Map
        id: nesting_map
        task: draw_map_curacao
        partial:
          geo_layers: ${{ workflow.nesting_layer.return }}
          tile_layers: ${{ workflow.base_maps.return }}
          static: false
          title: null
          max_zoom: 15
          view_state: ${{ workflow.nesting_map_view_state.return }}
          legend_style:
            placement: bottom-right

      - id: persist_nesting_map
        task: persist_text
        partial:
          text: ${{ workflow.nesting_map.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: nesting_map

      - name: Nesting Activity Map Widget
        id: nesting_map_widget
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Nesting Activity Map"
          data: ${{ workflow.persist_nesting_map.return }}

      - name: Nesting by Beach Table
        id: nesting_by_beach_df
        task: create_nesting_by_beach_table
        partial:
          df: ${{ workflow.nesting_data.return }}

      - id: nesting_by_beach_drawn
        task: draw_table
        partial:
          dataframe: ${{ workflow.nesting_by_beach_df.return }}
          columns: null
          table_config:
            enable_sorting: true
            enable_filtering: true
            enable_download: true
          widget_id: "nesting_by_beach_widget"

      - id: persist_nesting_by_beach
        task: persist_text
        partial:
          text: ${{ workflow.nesting_by_beach_drawn.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: nesting_by_beach

      - name: Nesting by Beach Widget
        id: nesting_by_beach_widget
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Total Nesting Activity by Beach"
          data: ${{ workflow.persist_nesting_by_beach.return }}

      - name: Nesting Success by Species & Beach Table
        id: nesting_success_species_beach_df
        task: create_nesting_success_by_species_beach_table
        partial:
          df: ${{ workflow.hatching_data.return }}

      - id: nest_success_sp_beach_drawn
        task: draw_table
        partial:
          dataframe: ${{ workflow.nesting_success_species_beach_df.return }}
          columns: null
          table_config:
            enable_sorting: true
            enable_filtering: true
            enable_download: true
          widget_id: "nest_success_sp_beach_widget"

      - id: persist_nest_success_sp_beach
        task: persist_text
        partial:
          text: ${{ workflow.nest_success_sp_beach_drawn.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: nesting_success_species_beach

      - name: Nesting Success by Species & Beach Widget
        id: nest_success_sp_beach_widget
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Nesting Success by Species & Beach"
          data: ${{ workflow.persist_nest_success_sp_beach.return }}

      - name: Nesting Success by Manipulation Table
        id: nesting_success_manipulation_df
        task: create_nesting_success_by_manipulation_table
        partial:
          df: ${{ workflow.hatching_data.return }}

      - id: nest_success_manip_drawn
        task: draw_table
        partial:
          dataframe: ${{ workflow.nesting_success_manipulation_df.return }}
          columns: null
          table_config:
            enable_sorting: true
            enable_filtering: true
            enable_download: true
          widget_id: "nest_success_manip_widget"

      - id: persist_nest_success_manip
        task: persist_text
        partial:
          text: ${{ workflow.nest_success_manip_drawn.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: nesting_success_manipulation

      - name: Nesting Success by Manipulation Widget
        id: nest_success_manip_widget
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Nesting Success by Nest Manipulation"
          data: ${{ workflow.persist_nest_success_manip.return }}

  # ── Nesting Activity Over Time ────────────────────────────────────────────

  - name: Nesting Activity Over Time
    id: nesting_over_time_chart
    task: draw_time_series_bar_chart_with_palette
    partial:
      dataframe: ${{ workflow.nesting_data.return }}
      x_axis: time
      y_axis: count
      category: specie
      agg_function: sum
      colors: ${{ workflow.chart_palette.return }}
      color_column: null
      layout_style:
        barmode: stack
        xaxis:
          title: "Month"
        yaxis:
          title: "Nesting Events"
      widget_id: "nesting_over_time_widget"

  - id: persist_nesting_over_time
    task: persist_text
    partial:
      text: ${{ workflow.nesting_over_time_chart.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: nesting_over_time

  - name: Nesting Activity Over Time Widget
    id: nesting_over_time_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Nesting Activity Over Time"
      data: ${{ workflow.persist_nesting_over_time.return }}

  # ── Turtle-Related Events ─────────────────────────────────────────────────

  - title: Turtle-Related Events
    type: task-group
    description: ""
    tasks:
      - id: turtle_colormap
        task: apply_qualitative_color_map
        partial:
          df: ${{ workflow.turtle_data.return }}
          input_column_name: activity_type

      - id: turtle_layer
        task: create_turtle_layer
        partial:
          df: ${{ workflow.turtle_colormap.return }}

      - id: turtle_map_view_state
        task: compute_fitted_view_state
        partial:
          geo_layers: ${{ workflow.turtle_layer.return }}
          max_zoom: 15

      - name: Turtle Events Map
        id: turtle_map
        task: draw_map
        partial:
          geo_layers: ${{ workflow.turtle_layer.return }}
          tile_layers: ${{ workflow.base_maps.return }}
          static: false
          output_type: html
          title: null
          max_zoom: 15
          view_state: ${{ workflow.turtle_map_view_state.return }}
          legend_style:
            placement: bottom-right

      - id: persist_turtle_map
        task: persist_text
        partial:
          text: ${{ workflow.turtle_map.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: turtle_map

      - name: Turtle Events Map Widget
        id: turtle_map_widget
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Turtle-Related Events Map"
          data: ${{ workflow.persist_turtle_map.return }}

      - name: Turtle Events by Location Table
        id: turtle_events_by_location_df
        task: create_turtle_events_by_location_table
        partial:
          df: ${{ workflow.turtle_data.return }}

      - id: turtle_events_by_location_drawn
        task: draw_table
        partial:
          dataframe: ${{ workflow.turtle_events_by_location_df.return }}
          columns: null
          table_config:
            enable_sorting: true
            enable_filtering: true
            enable_download: true
          widget_id: "turtle_events_by_location_widget"

      - id: persist_turtle_events_by_loc
        task: persist_text
        partial:
          text: ${{ workflow.turtle_events_by_location_drawn.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: turtle_events_by_location

      - name: Turtle Events by Location Widget
        id: turtle_events_by_location_widget
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Turtle Events by Location & Activity"
          data: ${{ workflow.persist_turtle_events_by_loc.return }}

  # ── Fibropapillomatosis (FP) Monitoring ───────────────────────────────────

  - title: Fibropapillomatosis (FP) Monitoring
    type: task-group
    description: FP cases by location and activity type.
    tasks:
      - name: FP by Location Table
        id: fp_by_location_df
        task: create_fp_by_location_table
        partial:
          df: ${{ workflow.turtle_data.return }}

      - id: fp_by_location_drawn
        task: draw_table
        partial:
          dataframe: ${{ workflow.fp_by_location_df.return }}
          columns: null
          table_config:
            enable_sorting: true
            enable_filtering: true
            enable_download: true
          widget_id: "fp_by_location_widget"

      - id: persist_fp_by_location
        task: persist_text
        partial:
          text: ${{ workflow.fp_by_location_drawn.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: fp_by_location

      - name: FP by Location Widget
        id: fp_by_location_widget
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "FP Monitoring by Location"
          data: ${{ workflow.persist_fp_by_location.return }}

  # ── Report ────────────────────────────────────────────────────────────────

  - title: HTML to PNG
    type: task-group
    description: Convert HTML maps and charts to PNG images for the report.
    tasks:
      - name: Convert Nesting Map to PNG
        id: nesting_map_png
        task: html_to_png
        partial:
          html_path: ${{ workflow.persist_nesting_map.return }}
          output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          config:
            full_page: false

      - name: Convert Turtle Map to PNG
        id: turtle_map_png
        task: html_to_png
        partial:
          html_path: ${{ workflow.persist_turtle_map.return }}
          output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          config:
            full_page: false

      - name: Convert Nesting Chart to PNG
        id: nesting_chart_png
        task: html_to_png
        partial:
          html_path: ${{ workflow.persist_nesting_over_time.return }}
          output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          config:
            full_page: false

  - name: Normalize Output Dir
    id: norm_output_dir
    task: remove_file_scheme
    partial:
      path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}

  - name: Generate DOCX Report
    id: docx_report
    task: generate_curacao_report
    skipif:
      conditions:
        - never
    partial:
      time_range: ${{ workflow.time_range.return }}
      nesting_map_png: ${{ workflow.nesting_map_png.return }}
      turtle_map_png: ${{ workflow.turtle_map_png.return }}
      nesting_chart_png: ${{ workflow.nesting_chart_png.return }}
      nesting_by_beach: ${{ workflow.nesting_by_beach_df.return }}
      nesting_success_species: ${{ workflow.nesting_success_species_beach_df.return }}
      nesting_success_manip: ${{ workflow.nesting_success_manipulation_df.return }}
      turtle_events_by_location: ${{ workflow.turtle_events_by_location_df.return }}
      fp_by_location: ${{ workflow.fp_by_location_df.return }}
      template_path: ${{ workflow.report_template_path.return }}
      output_dir: ${{ workflow.norm_output_dir.return }}
      total_nesting_count: ${{ workflow.total_nesting_count.return }}
      total_hatched_eggs: ${{ workflow.total_hatched_eggs.return }}
      hatching_success_pct: ${{ workflow.hatching_success_pct.return }}
      total_turtle_count: ${{ workflow.total_turtle_count.return }}
      total_fp_count: ${{ workflow.total_fp_count.return }}

  # ── Dashboard ─────────────────────────────────────────────────────────────

  - name: Create Dashboard
    id: dashboard
    task: gather_curacao_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.total_nesting_widget.return }}
        - ${{ workflow.total_hatched_eggs_widget.return }}
        - ${{ workflow.hatching_success_widget.return }}
        - ${{ workflow.total_turtle_widget.return }}
        - ${{ workflow.total_fp_widget.return }}
        - ${{ workflow.nesting_map_widget.return }}
        - ${{ workflow.nesting_over_time_widget.return }}
        - ${{ workflow.nesting_by_beach_widget.return }}
        - ${{ workflow.nest_success_sp_beach_widget.return }}
        - ${{ workflow.nest_success_manip_widget.return }}
        - ${{ workflow.turtle_map_widget.return }}
        - ${{ workflow.turtle_events_by_location_widget.return }}
        - ${{ workflow.fp_by_location_widget.return }}
      time_range: ${{ workflow.time_range.return }}
