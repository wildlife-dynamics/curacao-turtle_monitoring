[project]
name = "curacao-turtle-monitoring"
channels = [
  # 'file:///tmp/ecoscope-workflows-custom/release/artifacts/',
  'https://repo.prefix.dev/ecoscope-workflows/',
  'https://repo.prefix.dev/ecoscope-workflows-custom/',
  'conda-forge',
]
platforms = ['linux-64', 'osx-arm64', 'osx-64', 'win-64']

[dependencies]
curl = "*"
yq = "*"

[feature.compile.dependencies]
ecoscope-workflows-core = "0.22.18.*"
ecoscope-workflows-ext-ecoscope = "0.22.18.*"
ecoscope-workflows-ext-custom = "0.0.56"
pydeck = "0.9.2"

[feature.compile.pypi-dependencies]
ecoscope-workflows-ext-curacao = { path = "/Users/zak/Documents/w-dynamics/wd-partner-tasks/src/ecoscope-workflows-ext-curacao", editable = true }

[feature.compile.activation.env]
SETUPTOOLS_SCM_PRETEND_VERSION = "0.0.0"

[environments]
compile = { features = ["compile"], solve-group = "compile", no-default-feature = true }

[feature.compile.tasks.compile]
cmd = './dev/recompile.sh --install'

[feature.compile.tasks.recompile]
cmd = './dev/recompile.sh --update'
